server {
    listen 80;
    listen [::]:80;
    server_name saaskaya.com www.saaskaya.com *.saaskaya.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.saaskaya.com;

    ssl_certificate /etc/letsencrypt/live/saaskaya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saaskaya.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://saaskaya.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name saaskaya.com *.saaskaya.com;

    ssl_certificate /etc/letsencrypt/live/saaskaya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saaskaya.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
