server {
    listen 80;
    listen [::]:80;
    server_name saaskaya.digitaltamam.com;
    return 301 https://saaskaya.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name saaskaya.digitaltamam.com;

    ssl_certificate /etc/letsencrypt/live/saaskaya.digitaltamam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saaskaya.digitaltamam.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://saaskaya.com$request_uri;
}
